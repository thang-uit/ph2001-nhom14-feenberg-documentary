<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Dân chủ hóa thiết kế và quản trị công nghệ theo Andrew Feenberg</title>
  <desc id="desc">Banner phim tài liệu Triết học PH2001. Nền ivory, chữ charcoal, các vòng cobalt và sợi chỉ vermilion biểu trưng cho sự tham gia trong thiết kế công nghệ.</desc>
  <rect width="1600" height="560" rx="28" fill="#F4EFE5"/>
  <g font-family="Avenir Next, Arial, sans-serif">
    <rect x="74" y="66" width="38" height="5" rx="2.5" fill="#E04C32"/>
    <text x="132" y="77" font-size="18" font-weight="600" letter-spacing="2.2" fill="#254CCA">PHIM TÀI LIỆU TRIẾT HỌC · PH2001</text>
    <g fill="#252930" font-weight="700" font-size="68" letter-spacing="-1.8">
      <text x="74" y="178">Dân chủ hóa</text>
      <text x="74" y="268">thiết kế &amp; quản trị</text>
      <text x="74" y="358">công nghệ</text>
    </g>
    <text x="78" y="411" font-size="25" font-weight="500" fill="#254CCA">Theo Andrew Feenberg</text>
    <text x="78" y="487" font-size="18" fill="#555D68">Kịch bản có nguồn · Hình ảnh điện ảnh · Mã nguồn có thể dựng lại</text>
  </g>
  <path d="M1000 70V490" stroke="#D7D0C4" stroke-width="1"/>
