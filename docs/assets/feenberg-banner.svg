<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Dân chủ hóa thiết kế và quản trị công nghệ theo Feenberg</title>
  <desc id="desc">Nền giấy sáng, các đường cobalt và đỏ gạch chuyển động từ trải nghiệm người dùng đến thiết kế và quản trị.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f1e8d8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <style>
      .label{font:600 18px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.16em;fill:#263238}
      .title{font:700 54px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#18243b}
      .sub{font:400 22px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4b5563}
    </style>
  </defs>
  <rect width="1600" height="420" rx="28" fill="url(#paper)"/>
  <circle cx="1390" cy="60" r="150" fill="#d34b3f" opacity=".08" filter="url(#soft)"/>
  <circle cx="1470" cy="300" r="210" fill="#153f72" opacity=".08" filter="url(#soft)"/>
  <path d="M-30 368 C220 306 360 405 575 350 S900 298 1125 354 S1400 400 1650 318" fill="none" stroke="#153f72" stroke-width="10" opacity=".92" stroke-linecap="round">
    <animate attributeName="d" dur="11s" repeatCount="indefinite" values="M-30 368 C220 306 360 405 575 350 S900 298 1125 354 S1400 400 1650 318;M-30 338 C220 396 380 300 590 370 S905 398 1135 325 S1400 306 1650 365;M-30 368 C220 306 360 405 575 350 S900 298 1125 354 S1400 400 1650 318"/>
  </path>
  <path d="M-20 392 C190 330 375 418 580 372 S905 328 1135 382 S1405 410 1630 344" fill="none" stroke="#d34b3f" stroke-width="5" stroke-linecap="round" stroke-dasharray="16 18">
    <animate attributeName="stroke-dashoffset" dur="7s" values="0;-68" repeatCount="indefinite"/>
  </path>
  <g transform="translate(86 82)">
    <text class="label" y="0">NHÓM 14 · PH2001 · VIDEO ESSAY HỌC THUẬT</text>
    <text class="title" y="82">Công nghệ có thực sự trung lập?</text>
    <text class="sub" y="128">Dân chủ hóa thiết kế và quản trị công nghệ theo Andrew Feenberg</text>
    <g transform="translate(0 188)">
      <circle cx="10" cy="0" r="9" fill="#d34b3f"/>
      <text class="sub" x="32" y="8">trải nghiệm</text>
      <path d="M148 0 H218" stroke="#153f72" stroke-width="3"/>
      <circle cx="236" cy="0" r="9" fill="#153f72"/>
      <text class="sub" x="258" y="8">thiết kế</text>
      <path d="M354 0 H424" stroke="#153f72" stroke-width="3"/>
      <circle cx="442" cy="0" r="9" fill="#153f72"/>
      <text class="sub" x="464" y="8">quản trị</text>
    </g>
  </g>
</svg>
